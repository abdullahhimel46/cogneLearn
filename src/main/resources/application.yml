server:
  port: 8081

spring:
  application:
    name: cogneLearn
  datasource:
    url: jdbc:h2:file:./data/cognelearn;AUTO_SERVER=TRUE
    # Database files are stored in the data folder
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
  session:
    timeout: 8h
  mail:
    host: smtp.gmail.com
    port: 587
    # Set MAIL_USERNAME and MAIL_PASSWORD as environment variables to enable real SMTP.
    # If not set, the app falls back to NoOpEmailService (no emails sent).
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

cognelearn:
  email:
    # Set to true only when MAIL_USERNAME and MAIL_PASSWORD env vars are configured.
    enabled: ${COGNELEARN_EMAIL_ENABLED:false}

# ─── Authentication ──────────────────────────────────────────────────────────
# We used Spring Security session-based authentication (no JWT).
# After login, Spring sets a JSESSIONID cookie automatically.
# The session timeout is set to 8 hours for better user experience.
# spring.session.timeout: 8h (configured above)


playlistProxy:
  cacheTtlMs: 600000

