<button class="sidebar-control" id="themeToggle" type="button" aria-pressed="false">

    <!-- Moon Icon (Visible in light theme) -->
    <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"></path>
    </svg>
    <!-- Sun Icon (Visible in dark theme) -->
    <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
  </span>
  <span class="theme-label-text">Dark Mode</span>
</button>

<style>
  /* Modular self-contained theme toggle button styling */
  body:not(.dashboard-theme-dark) .theme-icon-sun {
    display: none !important;
  }
  body.dashboard-theme-dark .theme-icon-moon {
    display: none !important;
  }
  body.dashboard-theme-dark .theme-label-text {
    font-size: 0 !important;
  }
  body.dashboard-theme-dark .theme-label-text::before {
    content: "Light Mode" !important;
    font-size: 14px !important;
  }
</style>
