<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to your cogneLearn account to start your AI-powered adaptive learning journey.">
    <title>cogneLearn - Login</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/auth/login.css">
</head>

<body>
    <nav class="navbar">
        <div class="navbar-content">
            <a href="../../index.html" class="navbar-brand" aria-label="cogneLearn home">
                <span class="navbar-brand__mark" aria-hidden="true">CL</span>
                <span class="navbar-brand__name">cogneLearn</span>
            </a>
            <div class="navbar-right">
                <button class="theme-toggle-btn" type="button" aria-label="Toggle theme">
                    <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"></path>
                    </svg>
                    <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-header">
            <h2>Login to cogneLearn</h2>
        </div>

        <form id="authForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
        </form>

        <div class="auth-toggle">
            <span>Don't have an account? </span>
            <a href="register.html">Sign Up</a>
        </div>
    </div>

    <script src="../../js/user/User.js"></script>
    <script src="../../js/user/playlist.js"></script>
    <script src="../../js/user/Video.js"></script>
    <script src="../../js/user/StudySession.js"></script>
    <script src="../../js/user/ProductivityAnalytics.js"></script>
    <script src="../../js/user/AttentionMonitor.js"></script>
    <script src="../../js/user/utils.js"></script>
    <script src="../../js/user/auth.js"></script>
    <script>
        const authForm = document.getElementById('authForm');

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            await Auth.login(email, password);
        });
    </script>

    <div id="footer-container"></div>
    <script src="../../js/user/load-components.js"></script>
    <script>
        // Inline Theme Init & Toggle Script
        (() => {
            const themeKey = "cognelearn_dashboard_theme";
            const themeClass = "dashboard-theme-dark";
            const currentTheme = localStorage.getItem(themeKey);
            const isDark = currentTheme === "dark";
            if (isDark) {
                document.body.classList.add(themeClass);
            } else {
                document.body.classList.remove(themeClass);
            }
            
            const setupThemeButtons = () => {
                const buttons = document.querySelectorAll('.theme-toggle-btn');
                buttons.forEach(btn => {
                    const moonIcon = btn.querySelector('.theme-icon-moon');
                    const sunIcon = btn.querySelector('.theme-icon-sun');
                    
                    const updateIcons = (dark) => {
                        if (moonIcon && sunIcon) {
                            moonIcon.style.display = dark ? 'none' : 'block';
                            sunIcon.style.display = dark ? 'block' : 'none';
                        }
                    };
                    
                    updateIcons(document.body.classList.contains(themeClass));
                    
                    btn.onclick = (e) => {
                        if (e) e.preventDefault();
                        const nowDark = document.body.classList.toggle(themeClass);
                        localStorage.setItem(themeKey, nowDark ? "dark" : "light");
                        
                        document.querySelectorAll('.theme-toggle-btn').forEach(b => {
                            const m = b.querySelector('.theme-icon-moon');
                            const s = b.querySelector('.theme-icon-sun');
                            if (m && s) {
                                m.style.display = nowDark ? 'none' : 'block';
                                s.style.display = nowDark ? 'block' : 'none';
                            }
                        });
                    };
                });
            };
            
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', setupThemeButtons);
            } else {
                setupThemeButtons();
            }
        })();
    </script>
</body>

</html>
