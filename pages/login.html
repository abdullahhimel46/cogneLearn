    <script>
        let isSignupMode = false;
        const authForm = document.getElementById('authForm');
        const authTitle = document.getElementById('authTitle');
        const nameGroup = document.getElementById('nameGroup');
        const toggleText = document.getElementById('toggleText');

        // Check URL parameter for signup mode
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mode') === 'signup') {
            toggleAuthMode();
        }

        function toggleAuthMode(e) {
            if (e) e.preventDefault();

            isSignupMode = !isSignupMode;

            if (isSignupMode) {
                authTitle.textContent = 'Create Account';
                nameGroup.style.display = 'block';
                authForm.querySelector('button').textContent = 'Sign Up';
                toggleText.textContent = 'Already have an account? ';
                toggleText.nextElementSibling.textContent = 'Sign In';
            } else {
                authTitle.textContent = 'Login to cogneLearn';
                nameGroup.style.display = 'none';
                authForm.querySelector('button').textContent = 'Sign In';
                toggleText.textContent = "Don't have an account? ";
                toggleText.nextElementSibling.textContent = 'Sign Up';
            }
        }

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value;

            if (isSignupMode) {
                if (!name) {
                    alert('Please enter your name');
                    return;
                }
                await Auth.signup(email, password, name);
            } else {
                await Auth.login(email, password);
            }
        });
    </script>
